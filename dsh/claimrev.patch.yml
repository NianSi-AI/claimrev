# DeepSeek Harness (dsh) Cordis patch overlay for claimrev MCP plugin.
# When CLAIMREV_DSH_SESSIONS_DIR is set (e.g. by run_demo.sh), dsh writes headless
# test sessions into that isolated folder instead of polluting ~/.dsh/sessions/
# (which keeps DeepSeek Harness.app's sidebar clean).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: !!js process.env.DSH_PROVIDER || 'deepseek-account'
    model: !!js process.env.DSH_MODEL || 'deepseek-flash'

- id: session-persistence-jsonl
  name: "@deepseek-ai/dsh-session-persistence-jsonl"
  config:
    root: !!js process.env.CLAIMREV_DSH_SESSIONS_DIR || dshHomePath('sessions')

- insert:
    - id: mcp-claimrev
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: claimrev
        transport: stdio
        command: !!js process.env.CLAIMREV_MCP_BIN || 'claimrev-mcp'
        args: []
        env:
          CLAIMREV_STORE: !!js process.env.CLAIMREV_STORE || './.demo_store'
          CLAIMREV_PLUGINS: !!js process.env.CLAIMREV_PLUGINS || 'claimrev.examples.lrd_width.computations:register'
          CLAIMREV_MCP_LOG: !!js process.env.CLAIMREV_MCP_LOG || ''
